<style>
/* VOICE: a calm training logbook you check at 5:50 before a run.
   IDEA: the red-white trail blaze on Vitosha marks the way; today's card wears it.
   PICTURE: the week itself, seven day cards with today blazed and opened.
   COLOUR and TYPE: white ground, near-black ink, trail-marker red accent; Archivo + Inter.
   LAYOUT: one column for the phone, bottom tab bar, sticky week switcher. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111214);--card:light-dark(#f5f5f4,#1b1c1f);--ink:light-dark(#151515,#f1f1ef);--mute:light-dark(#66666b,#a1a1a8);--line:light-dark(#e2e2e0,#2c2d31);--red:light-dark(#d62d20,#ff5a4c);--soft:light-dark(#fbe7e5,#3a1c1a);--ok:light-dark(#1f7a3f,#57c27f);--warn:light-dark(#a86400,#f0b23d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0;line-height:1.1}
h1{font-size:32px;font-weight:800}h2{font-size:22px;font-weight:700;margin:24px 0 10px}
.wrap{max-width:720px;margin:0 auto;padding:16px max(4vw,14px)}
header .blaze{display:inline-block;width:22px;height:30px;vertical-align:-4px;margin-right:10px;background:linear-gradient(#fff 0 33%,var(--red) 33% 67%,#fff 67%);border:1px solid var(--line);border-radius:2px}
.races{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.race{flex:none;background:var(--card);border:0;border-radius:12px;padding:8px 12px;font-size:14px;text-align:left;color:var(--ink);line-height:1.3}.race small{display:block;color:var(--mute);font-size:12px}.race.sel small{color:#fff}
.race b{font-family:Archivo,Inter,sans-serif;font-size:22px;display:block}.race.a{box-shadow:inset 0 0 0 2px var(--red)}.race.sel{background:var(--red);color:#fff;box-shadow:none}
.weekbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.weekbar .t{flex:1;text-align:center;font-weight:600}
button{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;cursor:pointer}
button.pri{background:var(--red);color:#fff;border-color:var(--red)}button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.tot div{background:var(--card);border-radius:12px;padding:10px}.tot b{font-family:Archivo,Inter,sans-serif;font-size:22px;display:block}.tot span{font-size:13px;color:var(--mute)}
.meter{height:8px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--red)}
.day{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;position:relative}
.day.today{border:2px solid var(--red);background:var(--soft)}
.day.today::before{content:"";position:absolute;left:-2px;top:14px;width:6px;height:28px;background:linear-gradient(#fff 0 33%,var(--red) 33% 67%,#fff 67%)}
.dh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.dh .d{font-weight:600}.chip{font-size:13px;padding:2px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.chip.rest{color:var(--mute)}.chip.key{background:var(--red);color:#fff;border-color:var(--red)}
.wk{margin:8px 0 6px}.pace{font-weight:600}
.nums{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-top:6px}.nums b{color:var(--ink);white-space:nowrap}
.note{font-size:14px;color:var(--mute);margin-top:6px}
.coros{font-size:13px;margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--card)}
.coros.miss{color:var(--warn)}.coros.ok{color:var(--ok)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
form.ed{display:grid;gap:10px;margin-top:12px}
label{font-size:13px;color:var(--mute);display:grid;gap:4px}
input,textarea,select{font:16px Inter,sans-serif;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:90px}.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.msg{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--card)}.msg.err{color:var(--red)}.msg.good{color:var(--ok)}
.state{padding:24px;text-align:center;color:var(--mute)}
.list .it{display:grid;grid-template-columns:9em minmax(0,1fr);gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it b{font-weight:600}.list .it small{grid-column:2;color:var(--mute);font-size:14px}
.rec{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec .l{font-size:24px}.rec .m{font-size:14px;color:var(--mute)}
.scroll{overflow-x:auto}table{border-collapse:collapse;font-size:14px}td,th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;max-width:22em}th{background:var(--card);position:sticky;top:0}
.cv{padding:4px 8px;border-radius:6px}.cv.y{background:light-dark(#fff2cc,#3d3415);cursor:pointer}.cv.e{cursor:pointer;text-decoration:underline dotted}.cv.f{color:var(--ink)}
td.y{background:light-dark(#fff2cc,#3d3415);cursor:pointer}td.e{cursor:pointer}td.f{color:var(--mute)}td.y:hover,td.e:hover{outline:2px solid var(--red);outline-offset:-2px}
.sheetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--mute)}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;background:light-dark(#fff2cc,#3d3415);border:1px solid var(--line)}
.sheetx{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--red);padding:16px max(4vw,14px) calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25)}.sheetx .in{max-width:720px;margin:0 auto;display:grid;gap:10px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
.hero .lt{font-size:40px;line-height:1;grid-row:span 2}.hero .hb{font-weight:600}.hero .hs{font-size:14px;color:var(--mute)}.hero .acts{grid-column:1/-1;margin-top:6px}
.sv{font-size:13px;margin-top:8px;padding:6px 10px;border-radius:8px;background:light-dark(#fff1e8,#33231a);color:light-dark(#a2430f,#ffad7a)}
h2.sec{font-size:18px;margin:20px 0 4px}
.an{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--card);border-left:4px solid var(--red);font-size:14px;white-space:pre-line}.an b{display:block;margin-bottom:2px}
.tl{position:relative;display:flex;height:18px;border-radius:9px;overflow:hidden;margin:10px 0 2px}.tl span{display:block;height:100%}.tl i{position:absolute;top:-3px;bottom:-3px;width:4px;margin-left:-2px;background:var(--ink);border:2px solid var(--bg);border-radius:3px}
.tlr{position:relative;height:18px;font-size:11px;color:var(--mute)}.tlr span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin:4px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
h3.ct{font-size:16px;margin:18px 0 2px}.hs{font-size:14px;color:var(--mute);margin:2px 0 6px}
td.n{text-align:right;white-space:nowrap}.bd{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--card);color:var(--mute);white-space:nowrap;margin-left:6px}.bd.ok{color:var(--ok)}.bd.warn{color:var(--warn)}.bd.pr{background:var(--red);color:#fff}
.fig{position:relative;margin:4px 0 8px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute)}.stack td:empty{display:none}}
.cal{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;margin:8px 0}.cd{min-height:0;aspect-ratio:1;padding:0;border:0;border-radius:3px}.cd.fut{box-shadow:inset 0 0 0 1px var(--mute)}.cd.tdy{outline:2px solid var(--ink);outline-offset:1px}
.chk{display:grid;gap:6px}.ci{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:8px 10px;min-height:48px}.ci small{display:block;color:var(--mute);font-size:12px}.ci .bx{width:24px;height:24px;border:2px solid var(--mute);border-radius:6px;display:grid;place-items:center;font-weight:700}.ci.dn .bx{background:var(--red);border-color:var(--red);color:#fff}.ci.dn b{text-decoration:line-through;color:var(--mute)}.ci.late{border-color:var(--warn)}.ci:disabled{opacity:1}
.fpm,.fpt{display:flex;gap:6px;flex-wrap:wrap}.fpm button,.fpt button{min-height:38px;border-radius:20px;padding:0 14px;font-size:14px}.fpm button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.fpt{border-bottom:1px solid var(--line);gap:0;margin-top:8px}.fpt button{border:0;border-radius:0;background:none;color:var(--mute);border-bottom:3px solid transparent}.fpt button.on{color:var(--ink);border-bottom-color:var(--red);font-weight:600}
.fpn{display:flex;align-items:baseline;gap:10px;margin-top:14px}.fpn b{font-family:Archivo,Inter,sans-serif;font-size:52px;line-height:1}.fpn span{font-size:18px;font-weight:600}.fpn small{font-size:14px;color:var(--mute);font-weight:500}.fig[data-ch=fm]{touch-action:pan-y;cursor:crosshair}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{border:0;background:none;font-size:14px;color:var(--mute);padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}nav.tabs button[aria-current=true]{color:var(--red);font-weight:600}
.fresh{font-size:12px;color:var(--mute);margin-top:4px}
@media (prefers-reduced-motion:no-preference){.day{transition:background .2s}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<body>
<div class="wrap">
<header>
  <h1><span class="blaze" aria-hidden="true"></span>Бягане</h1>
  <div class="races" id="races"></div>
  <div class="fresh" id="fresh"></div>
</header>
<main id="view"><div class="state">Зареждам плана…</div></main>
</div>
<nav class="tabs" id="tabs">
  <button data-v="plan" aria-current="true">План</button>
  <button data-v="form">Форма</button>
  <button data-v="season">Сезон</button>
  <button data-v="rec">Възстан.</button>
  <button data-v="sheet">Таблица</button>
</nav>
<script>
window.__GAS__=true;
(function(){
  var API='https://script.google.com/macros/s/AKfycbxajGt7Iy4Ws7W6pElK-jzEUYXbKXRTtOIgLdbHj7TeRUAuaDqIFPGRna24x9Z0dbGp5w/exec';
  var m=location.hash.match(/t=([0-9a-f]{32})/);
  try{if(m){localStorage.setItem('byagane_t',m[1]);history.replaceState(null,'',location.pathname)}}catch(e){}
  var T='';try{T=localStorage.getItem('byagane_t')||''}catch(e){}
  if(!T){
    document.addEventListener('DOMContentLoaded',function(){
      document.getElementById('view').innerHTML='<div class="state"><p>Постави ключа на приложението (пратен ти от Claude):</p><input id="tk" style="width:100%;font-size:16px;padding:10px" autocomplete="off"><div class="acts"><button class="pri" id="tkok">Запази</button></div></div>';
      document.getElementById('tkok').onclick=function(){var v=document.getElementById('tk').value.trim();if(/^[0-9a-f]{32}$/.test(v)){localStorage.setItem('byagane_t',v);location.reload()}else alert('Ключът не е верен.')};
    });
  }
  function run(server,tool,input){
    if(!T)return new Promise(function(){});
    return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({t:T,server:server,tool:tool,input:input||{}})})
      .then(function(r){return r.json()},function(e){throw{code:'upstream_error',message:'Няма връзка с таблицата.',server:server,retryable:true}})
      .then(function(r){
        if(r&&r.__error){if(r.code==='unauthorized'){try{localStorage.removeItem('byagane_t')}catch(e){}}throw{code:r.code||'tool_error',message:r.message||'',server:server}}
        return{payload:r}});
  }
  var mcp={callTool:function(s,t,i){return run(s,t,i)},watchTool:function(){return function(){}},invalidate:function(){return Promise.resolve()}};
  window.claude={use:function(n){return Promise.resolve(n==='mcp'?mcp:null)}};
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js')});
})();
</script>
<script>
{
const SID='1My7A5ugH3J1LOmPdgr-ia2yBOGgw7w6nhR_ZCuBLUR0', GS='Google Sheets', CO='COROS';
const view=document.getElementById('view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sampleFn=null, anBusy={}, anErr='';
let fit=null, fitMsg='', sessionFitDone=false;
let strava={}, stravaErr='', wkMsg='', recMsg='';
let mcp=null, plan=[], season=null, recov=null, coros={}, corosErr='', cur='plan', weekStart=null, editing=null, sheetList=null, sheetSel=null, sheetVals=null;
const W=['Нед','Пон','Вт','Ср','Чт','Пт','Съб'];
const pd=s=>{const m=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);return m?new Date(+m[3],m[2]-1,+m[1]):null};
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const iso=d=>ymd(d).replace(/(\d{4})(\d\d)(\d\d)/,'$1-$2-$3');
const dm=d=>d.getDate()+'.'+(d.getMonth()+1);
const num=s=>{const n=parseFloat(String(s??'').replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n};
const today=new Date();today.setHours(0,0,0,0);
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const vals=p=>(p&&(p.values||p.content?.values))||[];
const errText=(e,srv)=>{const c=e&&e.code;
  if(c==='needs_reauth')return `Връзката с ${srv} е изтекла – свържи я отново в claude.ai → Настройки → Connectors.`;
  if(c==='server_not_connected'||c==='selection_required')return `${srv} не е свързан – добави го в claude.ai → Настройки → Connectors.`;
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return `Нямам разрешение за ${srv} – натисни „Опитай пак“ и разреши достъпа.`;
  if(c==='server_unavailable'||c==='upstream_error')return `${srv} не отговаря в момента – опитай след малко.`;
  if(c==='tool_error')return `${srv} отказа: ${String(e.message||'').slice(0,200)}`;
  return `Грешка при ${srv} (${c||'неизвестна'}).`};
const call=async(srv,tool,input,opt)=>(await mcp.callTool(srv,tool,input,opt)).payload;
const txt=p=>typeof p==='string'?p:(p&&p.text)||JSON.stringify(p||'');

async function loadPlan(refresh){
  const p=await call(GS,'get_values',{spreadsheetId:SID,range:'План!A5:L193'},{cache:refresh?{refresh:true,staleTime:0,gcTime:3e5}:{staleTime:6e4,gcTime:3e5}});
  plan=vals(p).map((r,i)=>({row:i+5,date:pd(r[0]),A:r[0]||'',B:r[1]||'',C:r[2]||'',D:r[3]||'',E:r[4]||'',F:r[5]||'',G:r[6]||'',H:r[7]||'',I:r[8]||'',J:r[9]||'',K:r[10]||'',L:r[11]||''})).filter(x=>x.date);
  document.getElementById('fresh').textContent='Таблицата е заредена '+new Date().toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'});
}
async function loadSeason(){
  const p=await call(GS,'get_values',{spreadsheetId:SID,range:'Сезон!A3:O50'},{cache:{staleTime:6e4,gcTime:3e5}});
  season=vals(p);renderRaces();
}
async function loadCoros(ws){if(window.__GAS__)return;
  corosErr='';
  const we=new Date(ws);we.setDate(we.getDate()+6);
  try{
    const t=txt(await call(CO,'queryTrainingSchedule',{startDate:ymd(ws),endDate:ymd(we)}));
    for(const b of t.split(/\n(?=\d{4}-\d\d-\d\d\n)/)){
      const m=b.match(/^(\d{4}-\d\d-\d\d)\n([^\n]+)/);if(!m)continue;
      const id=(b.match(/idInPlan:\s*(\d+)/)||[])[1], dist=(b.match(/Distance:\s*([\d.]+)\s*km/)||[])[1];
      (coros[m[1]]=coros[m[1]]||[]).push({name:m[2].trim(),id,dist:dist?+dist:null});
    }
    for(let d=new Date(ws);d<=we;d.setDate(d.getDate()+1)){if(!coros[iso(d)])coros[iso(d)]=[]}
  }catch(e){corosErr=errText(e,CO)}
}
async function loadStrava(ws){
  stravaErr='';const we=new Date(ws);we.setDate(we.getDate()+6);
  try{
    const p=await call('Strava','list_activities',{range_start:iso(ws)+'T00:00:00',range_end:iso(we)+'T23:59:59',first:60,use_preferred_units:true},{cache:{staleTime:6e4,gcTime:3e5}});
    for(let d=new Date(ws);d<=we;d.setDate(d.getDate()+1))strava[iso(d)]=[];
    for(const a of ((p&&(p.activities||p.content?.activities))||[])){const k=String(a.start_local||'').slice(0,10);(strava[k]=strava[k]||[]).push(a)}
  }catch(e){stravaErr=errText(e,'Strava')}
}
const fmtT=t=>{t=Math.round(t||0);const h=Math.floor(t/3600),m=Math.floor(t%3600/60);return h?h+':'+String(m).padStart(2,'0')+' ч':m+' мин'};
function stravaLine(x){
  const l=strava[iso(x.date)];if(!l||!l.length)return '';
  return l.map(a=>{const s=a.summary||{};
    if(/Run/.test(a.sport_type))return `<div class="sv">Strava: <b>${esc(s.distance_display||'')}</b> · ${esc(fmtT(s.moving_time))} · ${esc(s.avg_pace_display||'')}${s.elevation_gain_display?' · '+esc(s.elevation_gain_display)+' D+':''}</div>`;
    if(a.sport_type==='WeightTraining')return `<div class="sv">Strava: силова ${esc(fmtT(s.moving_time))}</div>`;
    return `<div class="sv">Strava: ${esc(a.sport_type)} ${esc(fmtT(s.moving_time))}</div>`}).join('');
}
const dmy=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
function recToday(){return recov?recov.slice(1).find(r=>pd(r[0])&&+pd(r[0])===+today):null}
function heroHtml(){
  const r=recToday();
  const advice={'🟢':'Тренирай по план.','🟡':'Дръж темпото в долната граница; ако се чувстваш тежък, пиши на Claude.','🔴':'Днес само леко или почивка – пиши на Claude за промяна.'};

const typeMult=d=>/^(Бърза|Тест)/.test(d)?1.35:/^Баири/.test(d)?1.3:/^Равно темпо/.test(d)?1.25:/^Състезание/.test(d)?1.1:/Възстановително/.test(d)?.85:/^(Дълго|Средно дълго|Backyard)/.test(d)?1:.95;
function pmc(){
  if(!hist||!plan.length)return null;
  const end=plan[plan.length-1].date, out=[];let ctl=0,atl=0;
  const pl={};for(const x of plan)pl[iso(x.date)]=x;
  for(let d=new Date(hist.from);d<=end;d.setDate(d.getDate()+1)){
    const k=iso(d),x=pl[k];let L;
    if(d<today||(+d===+today&&hist.load[k]))L=hist.load[k]||0;
    else L=x?num(x.G)*hist.rePerKm*typeMult(x.D):0;
    const c0=ctl,a0=atl,tsb=c0-a0;out.push({x:+d,ctl:c0,atl:a0,tsb,pct:c0>1?tsb/c0*100:0,L,fut:!(d<today||(+d===+today&&hist.load[k]))});
    ctl+=(L-ctl)/42;atl+=(L-atl)/7;
  }
  return out;
}

  }
  view.innerHTML=`<h2>Цялата таблица</h2><label>Лист<select id="shsel">${sheetList.map(t=>`<option ${t===sheetSel?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
  <div class="sheetbar"><span><span class="sw"></span> за попълване</span><span>· натисни клетка, за да я смениш · сивите са формули</span></div>
  <div id="shv" style="margin-top:12px">${body}</div>${cellEd?cellEditor():''}`;
}
let cellEd=null, addRace=false;
function cellEditor(){
  const c=cellEd.c, dv=c.dataValidation&&c.dataValidation.condition, opts=dv&&dv.type==='ONE_OF_LIST'?(dv.values||[]).map(v=>v.userEnteredValue):null;
  const cur=c.formattedValue??'';
  const lab=sheetVals[cellEd.i]?.values?.slice(0,cellEd.j).reverse().find(x=>x&&x.formattedValue&&!isY(x))?.formattedValue||'';
  return `<div class="sheetx" role="dialog" aria-label="Промяна на клетка"><form class="in" id="cellf">
  <div><b>${esc(sheetSel)} · ${esc(colL(cellEd.j)+(cellEd.i+1))}</b>${lab?' · '+esc(lab):''}</div>
  ${opts?`<select name="v">${opts.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="v" value="${esc(cur)}" autocomplete="off">`}
  <div class="note">Пиши както в таблицата: време 22:30:00, дата 23.04.2027, десетична запетая 208,5.</div>
  <div class="acts"><button class="pri" type="submit">Запази</button><button type="button" data-cclose="1">Откажи</button></div>
  <div class="msg" id="cellm" hidden></div></form></div>`;
}
function render(){renderRaces();charts={};({plan:renderPlan,season:renderSeason,rec:renderRec,sheet:renderSheet,race:renderRace,form:renderForm})[cur]();mountCharts()}
function showErr(e,srv){view.innerHTML=`<div class="state">${esc(errText(e,srv))}<div class="acts" style="justify-content:center"><button id="retry">Опитай пак</button></div></div>`}

async function goWeek(ws){weekStart=ws;editing=null;wkMsg='';render();if(mcp){await Promise.all([loadCoros(ws),loadStrava(ws)]);if(cur==='plan')render();autoAnalyze()}}
async function setView(v){
  cur=v;for(const b of document.querySelectorAll('#tabs button'))b.setAttribute('aria-current',String(b.dataset.v===v));
  render();
  try{
    if(v==='form'){const ps=[];if(!hist)ps.push(loadHistory());if(!season)ps.push(loadSeason());if(ps.length){await Promise.all(ps);if(cur==='form')render()}}
    if(v==='season'){const ps=[];if(!season)ps.push(loadSeason());if(!weeks)ps.push(loadWeeks());if(ps.length){await Promise.all(ps);if(cur==='season')render()}}
    if(v==='rec'&&!recov){recov=vals(await call(GS,'get_values',{spreadsheetId:SID,range:'Възстановяване!A3:K400'},{cache:{staleTime:6e4,gcTime:3e5}}));render()}
    if(v==='sheet'&&!sheetList){const p=await call(GS,'get_spreadsheet',{spreadsheetId:SID,fields:['sheets.properties.title','sheets.properties.hidden']});sheetList=((p&&(p.sheets||p.content?.sheets))||[]).filter(s=>!s.properties.hidden).map(s=>s.properties.title);render();if(sheetList.length&&!sheetSel)loadSheet(sheetList.includes('Табло')?'Табло':sheetList[0])}
  }catch(e){showErr(e,GS)}
}
async function loadSheet(t,fresh){
  sheetSel=t;if(!fresh)sheetVals=null;cellEd=null;render();
  try{
    const p=await call(GS,'get_spreadsheet',{spreadsheetId:SID,ranges:["'"+t.replace(/'/g,"''")+"'!A1:Z250"],fields:['sheets.data.rowData.values.formattedValue','sheets.data.rowData.values.userEnteredValue','sheets.data.rowData.values.effectiveFormat.backgroundColor','sheets.data.rowData.values.dataValidation.condition']},{cache:fresh?{refresh:true,staleTime:0,gcTime:3e5}:{staleTime:6e4,gcTime:3e5}});
    const sh=(p&&(p.sheets||p.content?.sheets))||[];
    sheetVals=(sh[0]?.data?.[0]?.rowData)||[];if(sheetSel===t)render();
  }catch(e){const el=document.getElementById('shv');if(el)el.textContent=errText(e,GS)}
}
const cell=v=>{v=String(v??'');return /^[+=]/.test(v)||/^\d{1,2}:\d\d$/.test(v.trim())?"'"+v:v};
function paceRange(f){
  const m=String(f).match(/(\d{1,2}):(\d\d)\s*[–-]\s*(\d{1,2}):(\d\d)/);if(m)return[m[1]*60+ +m[2],m[3]*60+ +m[4]];
  const s=String(f).match(/(\d{1,2}):(\d\d)/);return s?[s[1]*60+ +s[2],s[1]*60+ +s[2]]:null;
}
async function pushCoros(x){
  if(/^Почивка/.test(x.D))return 'Почивка – нищо за COROS.';
  const km=num(x.G), pr=paceRange(x.F), d=ymd(x.date);
  const name=(x.D.replace(/\s*\+.*$/,'')+(km?' '+String(km).replace('.',',')+' км':'')).slice(0,100);
  const desc=[x.E,x.F?'Темпо: '+x.F:'',x.K].filter(Boolean).join('\n');
  const t=txt(await call(CO,'queryTrainingSchedule',{startDate:d,endDate:d},{cache:false}));
  const id=(t.match(/idInPlan:\s*(\d+)/)||[])[1];
  if(id){
    const det=txt(await call(CO,'queryScheduledWorkoutDetails',{date:d,idInPlan:id},{cache:false}));
    if(!/Editable via MCP:\s*yes/i.test(det))return 'COROS не позволява промяна на тази тренировка (минала или вече изпълнена).';
    const cj=det.match(/Course JSON:\s*(\{.*\})\s*\n/);if(!cj)return 'Не успях да прочета тренировката в COROS.';
    const c=JSON.parse(cj[1]);c.courseName=name;c.courseDescription=desc;
    let note='';
    if(c.sections.length===1&&!c.sections[0].intervalGroup&&c.sections[0].targetType===1){
      const s=c.sections[0];if(km)s.targetValue=Math.round(km*1000);
      if(pr&&pr[0]>=120&&pr[1]<=1499){s.intensityType=2;delete s.sectionIntensity;delete s.intensityPercentStart;delete s.intensityPercentEnd;s.intensityValueStart=pr[0];s.intensityValueEnd=pr[1]}
    }else note=' Структурата (загрявка/повторения) е запазена – за промяна в нея пиши на Claude.';
    await call(CO,'updateScheduledWorkout',{date:d,idInPlan:id,course:c},{cache:false});
    return 'Обновено в COROS.'+note;
  }
  if(/^(Бърза|Баири|Равно темпо|Тест|Backyard|Състезание)/.test(x.D))return 'Структурираните тренировки (повторения, загрявка с лап) ги слага Claude в чата – пиши му.';
  if(!km||!pr)return 'Трябват км и темпо, за да я създам в COROS.';
  const diff=(x.date-today)/864e5;if(diff>90)return 'COROS приема тренировки до 90 дни напред.';
  await call(CO,'createScheduledWorkout',{date:d,course:{courseName:name,courseDescription:desc,sportType:/Витоша|trail|пътек/i.test(x.E)?5:1,sections:[{sectionType:2,targetType:1,targetValue:Math.round(km*1000),intensityType:2,intensityValueStart:pr[0],intensityValueEnd:pr[1]}]}},{cache:false});
  return 'Създадена в COROS.';
}
function alertMsg(t){const m=document.createElement('div');m.className='msg err';m.textContent=t;view.prepend(m)}
function msg(row,t,cls){const m=document.getElementById('m'+row);if(m){m.hidden=false;m.className='msg '+(cls||'');m.textContent=t}}

document.getElementById('races').addEventListener('click',async e=>{const b=e.target.closest('button[data-race]');if(!b)return;openRace(b.dataset.race)});
async function openRaceSheet(n){sheetSel=n;sheetVals=null;await setView('sheet');if(sheetList&&sheetList.includes(n))loadSheet(n);else{const el=document.getElementById('shv');if(el)el.textContent='Няма лист с име „'+n+'“.'}}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});
view.addEventListener('click',async e=>{
  const td=e.target.closest('[data-cell]');
  if(td){const[i,j]=td.dataset.cell.split(':').map(Number);cellEd={i,j,c:(sheetVals[i]?.values?.[j])||{}};render();document.querySelector('#cellf [name=v]')?.focus();return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cclose){cellEd=null;render();return}
  if(b.dataset.day){const d=new Date(b.dataset.day+'T00:00:00');weekStart=monday(d);await setView('plan');goWeek(weekStart);return}
  if(b.dataset.rep){weeklyReport(weekStart);return}
  if(b.dataset.fm){fmMetric=b.dataset.fm;render();return}
  if(b.dataset.fr){fmRange=b.dataset.fr;render();return}
  if(b.dataset.chk){const row=+b.dataset.chk,r=checks[row-1];const nv=String(r[3]||'').trim()?'':'✓';r[3]=nv;render();
    try{await call(GS,'update_values',{spreadsheetId:SID,range:'Проверка!D'+row,values:[[nv]]},{cache:false})}catch(err){r[3]=nv?'':'✓';render();alertMsg(errText(err,GS))}return}
  if(b.dataset.raceedit){openRaceSheet(raceSel);return}
  if(b.dataset.raceadd){addRace=true;render();document.querySelector('#racef [name=n]')?.focus();return}
  if(b.dataset.raceclose){addRace=false;render();return}
  if(b.id==='prev'){const w=new Date(weekStart);w.setDate(w.getDate()-7);goWeek(w)}
  else if(b.id==='next'){const w=new Date(weekStart);w.setDate(w.getDate()+7);goWeek(w)}
  else if(b.id==='todayb'){goWeek(monday(today))}
  else if(b.dataset.an){const x=plan.find(p=>p.row===+b.dataset.an);if(x&&!anBusy[x.row])analyzeDay(x)}
  else if(b.id==='howami'){b.disabled=true;b.textContent='Взимам от COROS…';recMsg='';
    try{await howAmI();const r=recToday();recMsg='Записано във „Възстановяване“.'}
    catch(err){recMsg='✗ '+(err&&err.code==='nodata'?'COROS още няма данни за съня от тази нощ – синхронизирай часовника и опитай пак.':errText(err,err&&err.server==='Google Sheets'?GS:CO))}
    render()}
  else if(b.id==='syncwk'){b.disabled=true;b.textContent='Синхронизирам…';wkMsg='';try{await syncWeek()}catch(err){wkMsg=errText(err,CO)}render()}
  else if(b.id==='reload'||b.id==='retry'){season=null;recov=null;sheetList=null;coros={};strava={};weeks=null;fcast=null;hist=null;checks=null;start(true)}
  else if(b.dataset.ed){editing=+b.dataset.ed;render();document.getElementById('d'+editing)?.scrollIntoView({block:'start'})}
  else if(b.dataset.cancel){editing=null;render()}
  else if(b.dataset.sync){
    const x=plan.find(p=>p.row===+b.dataset.sync);b.disabled=true;msg(x.row,'Изпращам към COROS…');
    try{const r=await pushCoros(x);msg(x.row,r,'good');coros={};await loadCoros(weekStart);render();msg(x.row,r,'good')}
    catch(err){msg(x.row,errText(err,CO)+' Провери в COROS преди да опиташ пак.','err')}
    b.disabled=false;
  }
});
view.addEventListener('change',e=>{if(e.target.id==='shsel')loadSheet(e.target.value)});
view.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='chkadd'){
    const t=String(new FormData(e.target).get('t')||'').trim();if(!t)return;
    try{const r=(checks?checks.length:1)+1;await call(GS,'update_values',{spreadsheetId:SID,range:`Проверка!A${r}:E${r}`,values:[[raceSel,/^[=+]/.test(t)?"'"+t:t,'','','']]},{cache:false});await loadChecks();render()}catch(err){alertMsg(errText(err,GS))}
    return;
  }
  if(e.target.id==='racef'){
    const f=e.target,fd=new FormData(f),m=document.getElementById('racem');
    const say=(t,c)=>{m.hidden=false;m.className='msg '+(c||'');m.textContent=t};
    const g=k=>String(fd.get(k)??'').trim(), dd=g('d').split('-');
    if(!g('n')||dd.length!==3){say('Трябват име и дата.','err');return}
    for(const btn of f.querySelectorAll('button'))btn.disabled=true;say('Записвам в „Сезон“…');
    try{
      const cur=vals(await call(GS,'get_values',{spreadsheetId:SID,range:'Сезон!B4:B9'},{cache:false}));
      let r=-1;for(let i=0;i<6;i++){if(!String(cur[i]?.[0]??'').trim()){r=i+4;break}}
      if(r<0){say('Няма свободен ред в „Сезон“ (места 4–9).','err');for(const btn of f.querySelectorAll('button'))btn.disabled=false;return}
      const nm=g('n').replace(/^[=+]/,"'$&");
      await call(GS,'update_values',{spreadsheetId:SID,range:`Сезон!A${r}:I${r}`,values:[[`${dd[2]}.${dd[1]}.${dd[0]}`,nm,g('p'),g('t'),g('km'),g('dp'),g('h'),g('g').replace(/^[=+]/,"'$&"),g('tp')]]},{cache:false});
      if(g('o'))await call(GS,'update_values',{spreadsheetId:SID,range:`Сезон!O${r}`,values:[[g('o').replace(/^[=+]/,"'$&")]]},{cache:false});
      addRace=false;season=null;await loadSeason();render();
      const st=document.createElement('div');st.className='msg good';st.textContent=`„${g('n')}“ е добавено в „Сезон“. В понеделник седмичната корекция ще преработи плана около него; ако искаш веднага, пиши на Claude. Прогнозата от Strava се появява, когато състезанието има собствен лист – и това може да направи Claude.`;
      view.prepend(st);
    }catch(err){say(errText(err,GS),'err');for(const btn of f.querySelectorAll('button'))btn.disabled=false}
    return;
  }
  if(e.target.id==='cellf'){
    const f=e.target,v=String(new FormData(f).get('v')??''),m=document.getElementById('cellm');
    const say=(t,c)=>{m.hidden=false;m.className='msg '+(c||'');m.textContent=t};
    if(/^=/.test(v.trim())){say('Формули не се пишат оттук.','err');return}
    for(const btn of f.querySelectorAll('button'))btn.disabled=true;say('Записвам…');
    const a1="'"+sheetSel.replace(/'/g,"''")+"'!"+colL(cellEd.j)+(cellEd.i+1);
    try{await call(GS,'update_values',{spreadsheetId:SID,range:a1,values:[[/^\+/.test(v)?"'"+v:v]]},{cache:false});
      if(sheetSel==='План'){plan=[];loadPlan(true).catch(()=>{})}if(sheetSel==='Сезон')season=null;if(sheetSel==='Възстановяване')recov=null;
      await loadSheet(sheetSel,true);
    }catch(err){say(errText(err,GS),'err');for(const btn of f.querySelectorAll('button'))btn.disabled=false}
    return;
  }const f=e.target, row=+f.dataset.row, x=plan.find(p=>p.row===row), fd=new FormData(f);
  const nx={...x};for(const k of['D','E','F','G','H','K'])nx[k]=String(fd.get(k)??'');
  if(!/^\d{1,2}\.\d{1,2}\.\d{4}/.test(x.A)){msg(row,'Неочаквана дата в реда – спирам.','err');return}
  for(const btn of f.querySelectorAll('button'))btn.disabled=true;msg(row,'Записвам в таблицата…');
  const g=nx.G.trim()===''?'':num(nx.G), h=nx.H.trim()===''?'':num(nx.H);
  try{
    const chk=vals(await call(GS,'get_values',{spreadsheetId:SID,range:'План!A'+row},{cache:false}));
    if(String(chk?.[0]?.[0]||'')!==x.A){msg(row,'Таблицата се е променила – натисни „Обнови“ и опитай пак.','err');for(const btn of f.querySelectorAll('button'))btn.disabled=false;return}
    await call(GS,'update_values',{spreadsheetId:SID,range:`План!D${row}:H${row}`,values:[[cell(nx.D),cell(nx.E),cell(nx.F),g,h]]},{cache:false});
    await call(GS,'update_values',{spreadsheetId:SID,range:`План!K${row}`,values:[[cell(nx.K)]]},{cache:false});
  }catch(err){msg(row,errText(err,GS),'err');for(const btn of f.querySelectorAll('button'))btn.disabled=false;return}
  let res='Записано в таблицата.';
  if(fd.get('co')){try{nx.G=String(g);res+=' '+await pushCoros(nx)}catch(err){res+=' COROS: '+errText(err,CO)}}
  editing=null;try{await loadPlan(true)}catch(_){}
  coros={};await loadCoros(weekStart);render();msg(row,res,'good');
});

async function start(refresh){
  view.innerHTML='<div class="state">Зареждам плана…</div>';
  mcp=await claude.use('mcp');
  if(!mcp){view.innerHTML='<div class="state">Връзката с Google Sheets и COROS не е достъпна тук. Отвори страницата в claude.ai или в приложението Claude.</div>';return}
  try{await loadPlan(refresh)}catch(e){showErr(e,GS);return}
  if(!weekStart)weekStart=monday(today);
  render();
  loadSeason().catch(()=>{});
  const rp=call(GS,'get_values',{spreadsheetId:SID,range:'Възстановяване!A3:K400'},{cache:{staleTime:6e4,gcTime:3e5}}).then(p=>{recov=vals(p)}).catch(()=>{});
  claude.use('sample').then(f=>{sampleFn=f}).catch(()=>{});
  loadFitness().then(()=>{if(cur!=='sheet')render()});
  await Promise.all([loadCoros(weekStart),loadStrava(weekStart),rp]);if(cur==='plan')render();else setView(cur);
  if(!window.__GAS__)for(let i=0;i<20&&sampleFn===null;i++)await new Promise(r=>setTimeout(r,500));
  await loadWeeks().catch(()=>{});
  if(!hist)loadHistory().then(()=>{if(cur==='form')render()});
  if(cur==='plan')render();autoAnalyze().then(autoReport);
}
start(false);
}
</script>
